  institution: Stanford University
  experiment_description: >-
    Delayed reaching in a maze task. The monkey fixated a central point, was shown one target without
    barriers, one target with barriers, or three targets with barriers of which one was accessible, and
    after a delay reached to the target on a vertical screen. Activity was recorded with two 96-channel
    Utah arrays, one in dorsal premotor cortex (PMd) and one in primary motor cortex (M1).
